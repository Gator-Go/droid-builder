apply plugin: 'com.android.application'

android {
    compileSdk 34
    namespace 'ppp.ppp.ppp'

    defaultConfig {
        applicationId 'ppp.ppp.ppp'
        minSdk 21
        targetSdk 34
        multiDexEnabled false
        versionCode 1
        versionName '1.0'
    }

    lint {
        abortOnError false
    }

    signingConfigs {
        release {
            keyAlias 'homeberrycloud'
            keyPassword System.getenv('KEY_PASSWORD')
            storeFile file('/home/gator/android/keytools/keys/homeberrycloud.keystore')
            storePassword System.getenv('STORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            versionNameSuffix '-release-xxxxx'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            if (variant.buildType.name == 'release') {
                outputFileName = "${baseName}-xxxxx.apk"
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation "androidx.camera:camera-camera2:1.4.0"
    implementation "androidx.camera:camera-lifecycle:1.4.0"
    implementation "androidx.camera:camera-view:1.4.0"
    implementation 'com.google.guava:guava:33.3.0-android'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
}